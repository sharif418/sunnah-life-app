org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
android.useAndroidX=true
# R8 is the only shrinker since AGP 7 — android.enableR8 was removed upstream.
org.gradle.caching=false
kotlin.daemon.jvmargs=-Xmx1024m
# Flutter 3.47.5 compatibility: its gradle plugin casts the android extension to
# the legacy AbstractAppExtension (FlutterPlugin.kt:353-354), so the AGP-9 new
# DSL must stay OFF here or the plugin apply fails with ClassCastException.
# (Verified locally: flags on -> scripts compile + plugin applies; flags off ->
# ClassCast at dev.flutter.flutter-gradle-plugin apply. The deprecation warning
# on the android{} accessor is benign — it does not fail the build.)
android.newDsl=false
android.builtInKotlin=false
