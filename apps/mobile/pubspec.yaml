name: sunnah_life
description: "সুন্নাহ লাইফ — Sunnah Life: Islamic companion app + Dawatus Sunnah Tarbiyah engine (As-Sunnah Foundation)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local DB (offline-first)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28

  # Prayer + calendar engines
  adhan_dart: ^1.0.11
  hijri: ^3.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Live usrah quiz (socket.io client for the NestJS gateway, path /socket.io)
  socket_io_client: ^3.1.6

  # Fonts + storage + net
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  # Bumped 0.19 → 0.20: flutter_localizations (SDK) pins intl ^0.20.3.
  intl: ^0.20.3
  path_provider: ^2.1.5
  # Pin the Android implementation to the pre-jnigen 2.2.x line: 2.3.x pulls
  # package:jni, whose Gradle plugin compiles native CMake code and forces a
  # ~2.8GB NDK download for zero benefit here (plain path lookups only).
  path_provider_android: ">=2.2.5 <2.3.0"
  path: ^1.9.0
  package_info_plus: ^8.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  # gen-l10n: ARB → lib/l10n/generated (committed, non-synthetic).
  generate: true
  assets:
    - assets/content/
    - assets/google_fonts/
