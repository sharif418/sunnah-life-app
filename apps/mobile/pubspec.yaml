name: sunnah_life
description: "সুন্নাহ লাইফ — Sunnah Life: Islamic companion app + Dawatus Sunnah Tarbiyah engine (As-Sunnah Foundation)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local DB (offline-first)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28

  # Prayer + calendar engines
  adhan_dart: ^1.0.11
  hijri: ^3.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Live usrah quiz (socket.io client for the NestJS gateway, path /socket.io)
  socket_io_client: ^3.1.6

  # Fonts + storage + net
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  # Bumped 0.19 → 0.20: flutter_localizations (SDK) pins intl ^0.20.3.
  intl: ^0.20.3
  path_provider: ^2.1.5
  # Pin the Android implementation to the pre-jnigen 2.2.x line: 2.3.x pulls
  # package:jni, whose Gradle plugin compiles native CMake code and forces a
  # ~2.8GB NDK download for zero benefit here (plain path lookups only).
  path_provider_android: ">=2.2.5 <2.3.0"
  path: ^1.9.0
  package_info_plus: ^8.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10
  # Qur'an per-ayah recitation with on-disk caching (LockCachingAudioSource).
  just_audio: ^0.10.4
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  # Donation link in the in-app browser (Chrome Custom Tabs on Android /
  # SFSafariViewController on iOS — LaunchMode.inAppBrowserView, C-W3g).
  url_launcher: ^6.3.2
  # https://sunnahlife.app/join/* + sunnahlife://join/* referral deep links
  # (cold start + warm stream, C-W3h).
  app_links: ^7.2.1
  # NOT phosphor_flutter: pub 2.1.0 (latest, incl. git HEAD) does not
  # compile under this Flutter pin — IconData became a final class and the
  # package subclasses it (flutter test hard-fails). The Phosphor fonts are
  # vendored in assets/fonts + a hand-written glyph table for the icons the
  # C-W4a/W4b chrome uses: lib/design/phosphor_icons.dart (MIT, license
  # committed beside the fonts).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14
  # v1→v2 outbox migration test needs a raw v1 sqlite file (drift itself
  # always generates the LATEST schema). Same package drift/native uses.
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  # gen-l10n: ARB → lib/l10n/generated (committed, non-synthetic).
  generate: true
  assets:
    - assets/content/
    - assets/google_fonts/
  # Vendored Phosphor icon fonts (see lib/design/phosphor_icons.dart for
  # the why — the pub package doesn't compile on this Flutter pin).
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
