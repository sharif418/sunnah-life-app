<!doctype html>
<html lang="bn" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অফলাইন — সুন্নাহ লাইফ</title>
    <meta name="theme-color" content="#1F4D3D" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "SolaimanLipi", "Noto Sans Bengali", system-ui, sans-serif;
        background: #f7f4ec;
        color: #222;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        background: #fff;
        border: 1px solid #e4dccb;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgb(31 77 61 / 0.08);
        padding: 32px 24px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 1.35rem;
        color: #1f4d3d;
        line-height: 1.6;
      }
      p {
        margin-top: 10px;
        font-size: 0.95rem;
        line-height: 1.75;
        color: #555;
      }
      .gold {
        margin-top: 14px;
        color: #b7791f;
        font-weight: 600;
        font-size: 0.8rem;
      }
      button {
        margin-top: 22px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #1f4d3d;
        color: #f7f4ec;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1613;
          color: #f1ede3;
        }
        .card {
          background: #16211c;
          border-color: #26382f;
          box-shadow: none;
        }
        h1 {
          color: #7fbf9f;
        }
        p {
          color: #9faaa2;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="13" fill="#1F4D3D" />
        <rect x="14.5" y="14.5" width="19" height="19" rx="2.5" stroke="#C99A3B" stroke-width="1.6" />
        <rect x="14.5" y="14.5" width="19" height="19" rx="2.5" stroke="#C99A3B" stroke-width="1.6" transform="rotate(45 24 24)" />
        <path
          d="M24 12.2c.5 0 .9.4.9.9v.5c2.8.5 4.9 2.9 4.9 5.8 0 1.5-.4 2.6-1 3.7l.9 1.6h-9.6l.9-1.6c-.6-1.1-1-2.2-1-3.7 0-2.9 2.1-5.3 4.9-5.8v-.5c0-.5.4-.9.9-.9Z"
          fill="#C99A3B"
        />
        <rect x="18.6" y="26.2" width="10.8" height="1.7" rx="0.85" fill="#C99A3B" />
        <rect x="20.2" y="29.4" width="7.6" height="1.7" rx="0.85" fill="#C99A3B" opacity="0.7" />
        <rect x="21.8" y="32.6" width="4.4" height="1.7" rx="0.85" fill="#C99A3B" opacity="0.45" />
      </svg>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>
        সংযোগ ফিরলে অ্যাপটি আবার খুলুন। ইনস্টল করা থাকলে নামাজের সময় ও আমলের খাতা
        অফলাইনেও আপনার ডিভাইসেই চলবে।
      </p>
      <p class="gold">সব হিসাব আপনার ডিভাইসেই হয় — কোথাও পাঠানো হয় না।</p>
      <button onclick="location.reload()">আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
