# ─────────────────────────────────────────────────────────────────────────────
# Sunnah Life — CI (GitHub Actions)
#
# Runs on every push to main/master and every pull request. Jobs activate only
# when their workspace exists, so the pipeline stays green while the monorepo
# lands one workstream at a time (apps/api, apps/admin, apps/mobile).
#
# NOTE (2026-09-28): the job-level `if: hashFiles(...) != ''` gates used in
# earlier revisions are INVALID — GitHub's workflow compiler rejects hashFiles()
# outside step context ("Unrecognized function: 'hashFiles'"), so every run since
# the first push failed with zero jobs ever started. Jobs are now gated on the
# `workspace` probe job's outputs (needs.workspace.outputs.<name>). Verified
# live via the Actions API on run #21+.
#
# Jobs:
#   workspace  file-existence probe (gates every job below)
#   tokens  design-token parity guard (tokens.json ↔ web globals.css)
#   api     lint · jest (unit + RLS e2e against postgres:16 + redis:7, seeded) · build
#   web     lint · production build (apps/web)
#   admin   lint · build (when apps/admin exists)
#   docker  image build + compose smoke — migrate·seed·health of the full stack
#   mobile  flutter analyze · test · debug APK (when apps/mobile exists)
#   release-apk  release APKs split per ABI (arm64 + armv7) · sizes + < 40 MB gate
#                · debug-signed device-test artifacts when no keystore secret
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default (Phase C/E): no job may write to the repo.
# Reads only — nothing here needs contents:write (the old report job that
# pushed .github/ci-status.md commits to main on every run is gone; results
# now live in the job summary + artifacts).
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Workspace existence probe. Job-level `if` CANNOT call hashFiles() — the
  # compiler rejects it (no filesystem exists before checkout), which is what
  # broke every earlier run. One checkout exports true/false per workspace;
  # each downstream job gates on needs.workspace.outputs.<name>.
  workspace:
    name: Workspace — existence matrix
    runs-on: ubuntu-latest
    outputs:
      tokens: ${{ steps.probe.outputs.tokens }}
      api: ${{ steps.probe.outputs.api }}
      web: ${{ steps.probe.outputs.web }}
      admin: ${{ steps.probe.outputs.admin }}
      mobile: ${{ steps.probe.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe workspaces
        id: probe
        run: |
          probe() { [ -f "$1" ] && echo true || echo false; }
          {
            echo "tokens=$(probe packages/design-tokens/package.json)"
            echo "api=$(probe apps/api/package.json)"
            echo "web=$(probe apps/web/package.json)"
            echo "admin=$(probe apps/admin/package.json)"
            echo "mobile=$(probe apps/mobile/pubspec.yaml)"
          } >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  tokens:
    name: Design tokens — parity check
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.tokens == 'true'
    steps:
      - uses: actions/checkout@v4

      # build.mjs is dependency-free (node:fs only) — no install step needed.
      - name: tokens.json ↔ globals.css parity guard
        working-directory: packages/design-tokens
        run: node build.mjs --check

  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: API — lint · test (PG16+Redis) · build
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.api == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Keep `sunnahlife` — the API's RLS migration hardcodes
          # GRANT … ON DATABASE sunnahlife (apps/api/prisma/migrations/*_rls).
          POSTGRES_DB: sunnahlife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunnahlife"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Exactly what apps/api/src/config/env.validation.ts reads (see
      # docs/DEPLOY_COOLIFY.md §4): runtime = the NOBYPASSRLS role, the test
      # bootstrap below + migrations run as the owner via DIRECT_URL.
      DATABASE_URL: postgresql://sunnah_app:sunnah_app@localhost:5432/sunnahlife
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sunnahlife
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-used-in-assertions
      SMS_PROVIDER: mock
      # Demo dataset (users/usrahs the RLS e2e signs in with): SEED_DEMO is
      # refused when NODE_ENV=production; CI runs with NODE_ENV unset.
      SEED_DEMO: "true"
      # Throttlers stay wired but with raised limits: 13 jest suites share one
      # Redis and sign in the same demo phones within the 10-minute window.
      THROTTLE_OTP_PER_10MIN: "200"
      THROTTLE_IP_PER_MIN: "5000"
      # MEILI_HOST stays unset — the api skips search indexing and the health
      # probe reports meilisearch "absent" instead of "down".

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile || bun install

      # Phase C content pipeline gate: packages/content is the single source;
      # the mobile copies must be byte-identical and no pack may be empty
      # (the owner's phone shipped with quran-meta = {"surahs": []}).
      - name: Content parity gate (packages/content ↔ mobile assets)
        run: bun run content:check

      - name: Prepare database (RLS role + migrations + demo seed)
        working-directory: apps/api
        run: |
          # Generate the Prisma client into src/generated/prisma (bun
          # workspaces: the @prisma/client postinstall cannot find this
          # schema from the .bun store, so generation must be explicit).
          bun run prisma:generate
          # Same bootstrap as infra/postgres/init-rls.sql: the restricted role
          # the runtime connects as (the app's own migration re-grants + adds
          # RLS policies — see apps/api/prisma/migrations/*_rls).
          psql "postgresql://postgres:postgres@localhost:5432/sunnahlife" \
            -c "CREATE ROLE sunnah_app LOGIN PASSWORD 'sunnah_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "GRANT CONNECT ON DATABASE sunnahlife TO sunnah_app" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO sunnah_app"
          # Tables + indexes + RLS policies (owner connection).
          bun run migrate:deploy
          # Demo users + amal history the RLS e2e signs in with
          # (docs/DEMO_ACCOUNTS.md) — idempotent, connects as DIRECT_URL.
          bun run seed

      - name: Lint (eslint)
        working-directory: apps/api
        run: |
          if grep -q '"lint":' package.json; then bun run lint; else echo 'no lint script — skipping'; fi

      - name: Unit + e2e tests (jest — includes the RLS gender-isolation e2e)
        working-directory: apps/api
        run: |
          if grep -q '"test":' package.json; then bun run test -- --runInBand; fi
          if grep -q '"test:e2e":' package.json; then bun run test:e2e; fi
        # --runInBand: the suites are integration tests against ONE shared
        # postgres — several sign in as the same seeded demo phones, and OTP
        # verify honors only the newest code per phone. Parallel workers
        # interleaved those sign-ins and raced the OTP rows (found by run #24:
        # P2025 "no record found for update" behind 7 rls.e2e 500s). Serial
        # execution is the correct topology for a shared-DB suite.

      - name: Build (nest build)
        working-directory: apps/api
        run: |
          if grep -q '"build":' package.json; then bun run build; else echo 'no build script — skipping'; fi

  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint · production build (apps/web)
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      # NOTE: `next build` is intentionally NOT run in the build sandbox (2
      # vCPU / 4 GB) — here on CI it gets a proper runner. The web app has NO
      # local database (single NestJS backend, NEXT_PUBLIC_API_BASE build arg).
      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile || bun install

      - name: Lint (eslint)
        working-directory: apps/web
        run: bun run lint

      - name: Production build (next build, standalone)
        working-directory: apps/web
        run: bun run build

  # ───────────────────────────────────────────────────────────────────────────
  admin:
    name: Admin — lint · build
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        working-directory: apps/admin
        run: bun install --frozen-lockfile || bun install

      - name: Lint (if configured)
        working-directory: apps/admin
        run: |
          if grep -q '"lint":' package.json; then bun run lint; else echo 'no lint script — skipping'; fi

      - name: Build (if configured)
        working-directory: apps/admin
        run: |
          if grep -q '"build":' package.json; then bun run build; else echo 'no build script — skipping'; fi

  # ───────────────────────────────────────────────────────────────────────
  # Docker — build the compose images (api, worker=api, web, admin) and
  # smoke-test the FULL stack on the runner's Docker: compose up --wait, then
  # assert the api /health (migrations + seed:reference done), web / and
  # admin / answer 200 on the published ports, and the seeded amal catalog
  # actually landed in Postgres. This is the W2d proof: the sandbox cannot
  # run Docker, so this job is the only place the Dockerfiles, .dockerignore
  # files and compose wiring are exercised end-to-end.
  # [C-W5-ops] The smoke curls the READINESS alias /health on purpose (it
  # proves migrations+seed+deps from inside the container); the container
  # healthchecks themselves moved to /health/live.
  docker:
    name: Docker — image build + compose smoke (migrate·seed·health)
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.api == 'true' && needs.workspace.outputs.web == 'true' && needs.workspace.outputs.admin == 'true'
    timeout-minutes: 40
    env:
      # compose interpolates these from the shell (no .env on CI)
      POSTGRES_PASSWORD: ci-smoke-pg-password
      SUNNAH_APP_PASSWORD: ci-smoke-app-password
      MINIO_ROOT_USER: ci-smoke-minio
      MINIO_ROOT_PASSWORD: ci-smoke-minio-secret
      MEILI_MASTER_KEY: ci-smoke-meili-master-key-0123456789abcdef
      JWT_SECRET: ci-smoke-jwt-access-secret-1234
      JWT_REFRESH_SECRET: ci-smoke-jwt-refresh-secret-5678
      QUIZ_SECRET: ci-smoke-quiz-secret-9012
      SMS_PROVIDER: sslwireless
      SMS_SSLWIRELESS_URL: https://sms.example.invalid/send
      SMS_SSLWIRELESS_USER: ci-smoke
      SMS_SSLWIRELESS_PASS: ci-smoke-pass
      STACK_TAG: ci-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Compose config sanity (interpolation + schema)
        run: docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml config >/dev/null

      - name: Build the four images (api, worker=api, web, admin)
        run: docker compose -f infra/docker-compose.yml build

      - name: Compose up — wait for health
        run: >-
          docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml
          up -d --wait --wait-timeout 420
          api worker web admin postgres redis meilisearch

      - name: Smoke — API health (migrations + seed done, serving)
        run: |
          docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml exec -T api curl -fsS http://localhost:4000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      # A liveness probe that 429s or flaps only shows up after several probe
      # cycles (the OTP throttler once rate-limited /health/live: healthy at
      # boot, unhealthy ~2 min later, Traefik dropped the api on Coolify).
      - name: Smoke — API stays healthy for 3 minutes (probe throttling / flaps)
        run: |
          C="docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml"
          API=$($C ps -q api)
          for i in $(seq 1 18); do
            sleep 10
            code=$($C exec -T api curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health/live)
            state=$(docker inspect --format '{{.State.Health.Status}}' "$API")
            echo "t+$((i*10))s /health/live=$code docker=$state"
            if [ "$code" != "200" ]; then echo "::error::/health/live returned $code after $((i*10))s"; exit 1; fi
            if [ "$state" = "unhealthy" ]; then echo "::error::api container went unhealthy after $((i*10))s"; exit 1; fi
          done

      - name: Smoke — web / and admin / (HTTP 200 through published ports)
        run: |
          curl -fsS -o /dev/null -w "web:%{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "admin:%{http_code}\n" http://localhost:3002/

      - name: Smoke — seeded reference data exists (amal catalog row count)
        run: |
          docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml exec -T postgres psql -U postgres -d sunnahlife -tAc \
            "SELECT COUNT(*) FROM \"AmalDefinition\"" | tee /tmp/defs.txt
          test "$(cat /tmp/defs.txt | tr -d '[:space:]')" -ge 30

      - name: Always — logs + teardown
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml ps || true
          docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml logs --tail=80 api worker web admin postgres || true
          docker compose -f infra/docker-compose.yml down -v --remove-orphans

  # ───────────────────────────────────────────────────────────────────────────
  mobile:
    name: Flutter — analyze · test · debug APK
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v4

      # JDK 21 — the toolchain this build was verified with locally
      # (OpenJDK 21; AGP 9.1 requires 17+, and 21 is what the sandbox proof
      # used: scripts compile, flutter plugin applies, NDK auto-install path).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the SDK the repo is verified against (analyze 0 issues,
          # tests 65/65 in the sandbox) so a new stable can't break CI overnight.
          flutter-version: 3.47.5
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter doctor
        run: flutter --version

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      # arm64 only: the universal (3-ABI) debug APK failed in packageDebug on
      # the hosted runner (run 36712118843, twice). Device tests use the
      # release split APKs; this debug build is compile/packaging proof.
      - name: Build debug APK (arm64)
        working-directory: apps/mobile
        run: |
          df -h / | tail -1
          # One retry: :app:packageDebug (IncrementalSplitterRunnable) has
          # failed intermittently on the hosted runner with no code change.
          flutter build apk --debug --target-platform android-arm64             || flutter build apk --debug --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          # The whole point of this job is the artifact — fail loudly if the
          # APK is missing instead of warning and reporting a green run.
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Release APKs, split per ABI (PLAN W3i) — the owner's device-test build.
  # NOT secrets-gated: without the upload keystore the APKs are signed with
  # the debug key (installable on a phone for testing, NOT uploadable to
  # Play — artifacts named internal-test-<abi>); with the secrets present
  # they are store-signed and named mobile-release-<abi>. Sizes land in the
  # job summary and the arm64 build HARD-FAILS the job if it exceeds the
  # 40 MB target from docs/PLAN.md.
  release-apk:
    name: Flutter — release APKs · split-per-ABI (device test)
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.mobile == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the mobile job — see the note there.
          flutter-version: 3.47.5
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      # [C-W5-ops] The release app must never target the placeholder API
      # default (https://sunnahlife.app — nothing is deployed there; sign-in
      # failed on real phones). The base URL is a repository VARIABLE (not a
      # secret — it is not sensitive). An unset/empty variable fails the
      # release builds loudly instead of shipping an app that cannot sign in.
      - name: Resolve SUNNAH_API_BASE (fail when unset)
        id: apibase
        env:
          SUNNAH_API_BASE: ${{ vars.SUNNAH_API_BASE }}
        run: |
          if [ -z "$SUNNAH_API_BASE" ]; then
            echo "::error::Repository variable SUNNAH_API_BASE is empty. Set it under Settings → Secrets and variables → Actions → Variables (e.g. https://api-staging.sunnahlife.ailearnersbd.com). Release builds must never target the placeholder default."
            exit 1
          fi
          echo "base=$SUNNAH_API_BASE" >> "$GITHUB_OUTPUT"

      # Same pattern as release-bundle, except absence of the secret is a
      # NOTICE (debug-signed device-test build), not a skip: the whole point
      # of this job is that the owner can install a release build TODAY.
      - name: Decode google-services.json (Firebase Android config)
        working-directory: apps/mobile/android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 not set — building without google-services.json (lib/firebase_options.dart still carries the Android config)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Decode signing key (debug-signed when secrets absent)
        id: keystore
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 — the release APKs will be DEBUG-signed: installable on the owner's phone for testing, NOT uploadable to Play."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<PROPS
          storeFile=upload-keystore.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (split per ABI)
        working-directory: apps/mobile
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=SUNNAH_API_BASE=${{ steps.apibase.outputs.base }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Sizes → job summary + arm64 < 40 MB gate
        working-directory: apps/mobile/build/app/outputs/flutter-apk
        run: |
          set -eu
          ls -l ./*.apk
          ARM64=$(stat -c%s app-arm64-v8a-release.apk)
          ARM32=$(stat -c%s app-armeabi-v7a-release.apk)
          {
            echo "### Release APK sizes (split-per-ABI)"
            echo ""
            echo "Signing: ${{ steps.keystore.outputs.signed == 'true' && 'upload keystore (store-signed)' || 'DEBUG key (device-test only)' }}"
            echo ""
            echo "| ABI | File | Size |"
            echo "|---|---|---|"
            echo "| arm64-v8a | app-arm64-v8a-release.apk | $((ARM64 / 1024 / 1024)) MB ($ARM64 bytes) |"
            echo "| armeabi-v7a | app-armeabi-v7a-release.apk | $((ARM32 / 1024 / 1024)) MB ($ARM32 bytes) |"
            echo ""
            echo "Target from docs/PLAN.md W3i: arm64-v8a < 40 MB."
          } >> "$GITHUB_STEP_SUMMARY"
          LIMIT=$((40 * 1024 * 1024))
          if [ "$ARM64" -ge "$LIMIT" ]; then
            echo "::error::arm64-v8a release APK is $ARM64 bytes (>= $LIMIT). The < 40 MB target is NOT met."
            exit 1
          fi

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && 'mobile-release-arm64-v8a' || 'internal-test-arm64-v8a' }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && 'mobile-release-armeabi-v7a' || 'internal-test-armeabi-v7a' }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Release bundle — Android App Bundle (.aab), signed with the store key.
  # Runs only when the ANDROID_KEYSTORE_BASE64 secret family exists (Phase B:
  # release artifacts gated behind secrets; debug APK above is always built).
  release-bundle:
    name: Flutter — release App Bundle (secrets-gated)
    runs-on: ubuntu-latest
    needs: workspace
    if: needs.workspace.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the mobile job — see the note there.
          flutter-version: 3.47.5
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      # [C-W5-ops] The release app must never target the placeholder API
      # default (https://sunnahlife.app — nothing is deployed there; sign-in
      # failed on real phones). The base URL is a repository VARIABLE (not a
      # secret — it is not sensitive). An unset/empty variable fails the
      # release builds loudly instead of shipping an app that cannot sign in.
      - name: Resolve SUNNAH_API_BASE (fail when unset)
        id: apibase
        env:
          SUNNAH_API_BASE: ${{ vars.SUNNAH_API_BASE }}
        run: |
          if [ -z "$SUNNAH_API_BASE" ]; then
            echo "::error::Repository variable SUNNAH_API_BASE is empty. Set it under Settings → Secrets and variables → Actions → Variables (e.g. https://api-staging.sunnahlife.ailearnersbd.com). Release builds must never target the placeholder default."
            exit 1
          fi
          echo "base=$SUNNAH_API_BASE" >> "$GITHUB_OUTPUT"

      # The signing material is injected from secrets — see docs/RELEASE.md §3.
      # Without the secrets the step fails loudly with instructions.
      - name: Decode google-services.json (Firebase Android config)
        working-directory: apps/mobile/android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 not set — building without google-services.json (lib/firebase_options.dart still carries the Android config)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Decode signing key (skips when secrets absent)
        id: keystore
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — skipping the signed bundle (debug APK artifact covers CI proof)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<PROPS
          storeFile=upload-keystore.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          PROPS
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build release App Bundle
        if: steps.keystore.outputs.skip != 'true'
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define=SUNNAH_API_BASE=${{ steps.apibase.outputs.base }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Upload release bundle
        if: steps.keystore.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # CI report — writes the per-job results table into the run's JOB SUMMARY
  # ($GITHUB_STEP_SUMMARY) only. It must NEVER push commits to main: an
  # auto-pushing report job causes a rebase hazard for every contributor and
  # re-triggers workflows (Phase C Part E requirement).
  report:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [tokens, api, web, admin, docker, mobile, release-apk, release-bundle]
    if: always()
    steps:
      - name: Write job summary table
        run: |
          {
            echo "# CI — run ${{ github.run_id }}"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| tokens | ${{ needs.tokens.result }} |"
            echo "| api | ${{ needs.api.result }} |"
            echo "| web | ${{ needs.web.result }} |"
            echo "| admin | ${{ needs.admin.result }} |"
            echo "| docker (compose smoke) | ${{ needs.docker.result }} |"
            echo "| mobile (analyze·test·debug apk) | ${{ needs.mobile.result }} |"
            echo "| release-apk (split-per-abi, < 40 MB gate) | ${{ needs.release-apk.result }} |"
            echo "| release-bundle (aab, secrets-gated) | ${{ needs.release-bundle.result }} |"
            echo "| mobile (debug APK) | ${{ needs.mobile.result }} |"
            echo "| release-bundle (aab) | ${{ needs.release-bundle.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
