# CI-only compose override (C/W2d) — used by the GitHub Actions `docker` job:
#   docker compose -f infra/docker-compose.yml -f infra/ci-smoke.compose.yml up ...
#
# WHY THIS EXISTS: quay.io (the last public MinIO home) has required
# `docker login` since 2026-09-24 and Docker Hub's minio org is gone — there
# is NO anonymous MinIO pull anymore. The smoke therefore starts the stack
# WITHOUT minio/minio-init (the explicit service list in the CI job skips
# them) and runs the api on its LOCAL storage adapter (S3_* cleared): the
# same code path any deployment without S3 env uses — the /health storage
# check then validates the local dir is writable.
#
# Production keeps MinIO by default (operators: `docker login quay.io`).
services:
  api:
    # drop the minio-init dependency (restated without it — compose !reset
    # clears the merged mapping first; requires compose >= 2.24)
    depends_on: !reset
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PUBLIC_BASE: ""
  worker:
    environment:
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PUBLIC_BASE: ""
