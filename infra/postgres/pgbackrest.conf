# pgBackRest configuration for the Sunnah Life PostgreSQL backups.
#
# Off-site backups: repo1 is a REMOTE S3 bucket (NOT the local MinIO — a VPS
# fire must not take the only copy with it). Fill in the <…> placeholders and
# run via the documented one-shot container in docs/DEPLOY_COOLIFY.md
# (§ Backups — the container mounts the pgdata volume read-only + this file).
#
# The local MinIO can serve as a SECONDARY (repo2) if you want an on-prem
# near-copy — add a repo2-* block with its endpoint/keys.

[global]
# ── off-site S3 repository ──────────────────────────────────────────────────
repo1-type = s3
repo1-path = /sunnahlife
repo1-s3-endpoint = <offsite-s3-endpoint>        # e.g. s3.amazonaws.com or s3.<region>.amazonaws.com
repo1-s3-bucket = <offsite-bucket>
repo1-s3-region = <offsite-region>
repo1-s3-key = <offsite-access-key>
repo1-s3-key-secret = <offsite-secret-key>
repo1-s3-verify-tls = y
repo1-s3-host = <optional-bucket-host>           # only for S3-compatible providers

# ── encryption at rest in the repo (MANDATORY: rows contain sisters' data) ──
repo1-cipher-type = aes-256-cbc
repo1-cipher-pass = <generate-openssl-rand-base64-48>

# ── retention: 2 fulls + diffs, ~1 month of PITR ─────────────────────────────
repo1-retention-full = 2
repo1-retention-diff = 6
repo1-retention-archive = 30
process-max = 2

# ── behaviour ────────────────────────────────────────────────────────────────
start-fast = y
compress-type = zst
compress-level = 3
log-level-console = info
log-level-file = detail
log-path = /var/log/pgbackrest

# ── stanza: the Sunnah Life database on the pgdata volume ────────────────────
# Connects over the shared unix-socket volume (`pgsocket` in docker-compose) —
# the official postgres image trusts local socket connections, so no passwords
# travel. The backup containers mount:
#   -v sunnahlife_pgdata:/var/lib/postgresql/data[:ro]
#   -v sunnahlife_pgsocket:/var/run/postgresql
[sunnahlife]
pg1-path = /var/lib/postgresql/data
pg1-socket-path = /var/run/postgresql
pg1-port = 5432
pg1-user = postgres
